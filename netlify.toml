[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "server"

[functions]
  # external_node_modules = ["express", "serverless-http", "cors", "@supabase/supabase-js"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
