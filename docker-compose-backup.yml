version: '3.8'

services:
  db-backup:
    build: 
      context: .
      dockerfile: backup/Dockerfile
    image: whatsapp-backup-service:latest
    container_name: database_backup_worker
    restart: always
    volumes:
      # Mount the CSV so it knows what to backup
      - ./domains.csv:/app/domains.csv:ro
      
      # Mount the host folder to save backups persistently
      - ./database_backups:/app/backups
    
    # Optional: Run immediately on start, then wait 24h (handled by script)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
