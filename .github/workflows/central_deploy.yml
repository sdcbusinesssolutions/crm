name: Centralized Multi-Server Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - specific_domain
      specific_domain:
        description: 'Specific Domain to deploy (if "specific_domain" is selected)'
        required: false
        type: string
      dry_run:
        description: 'Dry Run (check configuration without deploying)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy via Self-Hosted Runner
    # Target the self-hosted runner. Ensure your runner on 72.61.255.20 has this label.
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (For validation scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Prepare domains.csv (Parameterization)
        shell: bash
        run: |
          echo "Analyzing Deployment Parameters..."
          if [ "${{ github.event.inputs.deployment_type }}" == "specific_domain" ]; then
            if [ -z "${{ github.event.inputs.specific_domain }}" ]; then
              echo "Error: specific_domain was selected but no domain was provided."
              exit 1
            fi
            echo "Filtering domains.csv for domain: ${{ github.event.inputs.specific_domain }}"
            
            # Extract header
            head -n 1 domains.csv > domains_temp.csv
            # Extract matching row
            grep "${{ github.event.inputs.specific_domain }}" domains.csv >> domains_temp.csv || true
            
            # Replace original CSV
            mv domains_temp.csv domains.csv
          fi
          
          echo "Domains planned for deployment:"
          cat domains.csv

      - name: Execute Central Deploy Script
        if: ${{ github.event.inputs.dry_run == 'false' }}
        shell: bash
        run: |
          echo "Starting centralized deployment from self-hosted agent..."
          chmod +x central_deploy.sh
          chmod +x prepare_upload.sh
          chmod +x remote_exec.sh
          
          # Execute the main Bash deployment script
          ./central_deploy.sh

      - name: Dry Run Information
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN MODE: No changes have been pushed to the remote servers."
          echo "The following setup was verified:"
          ls -la
          echo "Domains to be deployed:"
          cat domains.csv
