services:
  whatsapp-app:
    build: 
      context: .
      args:
        - VITE_CLIENT_URL=${CLIENT_URL}
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY}
        - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
        - VITE_MASTER_URL=${VITE_MASTER_URL}
        - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
    image: whatsapp-app:${IMAGE_TAG}
    restart: always
    user: root
    
    # 🔄 SCALABILITY CONFIGURATION (Docker Swarm Compatible)
    # 🔄 HIGH PERFORMANCE SCALING (For 32GB RAM / 8 Cores)
    # 🔄 SCALABILITY CONFIGURATION (Dynamic for Bulk Deployment)
    deploy:
      mode: replicated
      replicas: ${APP_REPLICAS:-1} # Default to 1. Set APP_REPLICAS=6 in .env for high-traffic single domains.
      endpoint_mode: vip
      resources:
        limits:
          cpus: '1.0'    # Hard limit per container
          memory: 1G     # Hard limit per container
        reservations:
          cpus: '0.1'    # minimal reservation to allow high density
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    # NOTE: Native Docker Compose cannot Auto-Scale based on CPU %.
    # You must use Docker Swarm with a service like 'orbiter' or Kubernetes HPA.
    
    # Set container name to domain for easy identification
    # container_name: ${DOMAIN} # DISABLED: Must be removed when using replicas > 1 

    # env_file:
    #   - ./server/.env
    
    environment:
      - TZ=Asia/Kolkata
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - APP_URL=${APP_URL}
      - PORT=5000
      - NODE_ENV=production
      - VITE_CLIENT_URL=${CLIENT_URL}
      - DOMAIN=${DOMAIN}
      - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      # Drip Campaign Workers Configuration
      - DRIP_WORKER_COUNT=${DRIP_WORKER_COUNT:-1}
      # ─────────────────────────────────────────────────────────────────
      # NODE.JS MEMORY & GC OPTIMIZATION
      # Container limit: 1GB. OS overhead: ~100MB. Node usable: ~768MB.
      # --max-old-space-size=768  : V8 heap ceiling. GC triggers before OOM kill.
      # --max-semi-space-size=64  : Young-gen (new objects) arena. Larger = fewer minor GCs = faster throughput.
      # --expose-gc               : Allows manual gc() calls in code for cleanup after bulk ops.
      # --optimize-for-size       : Smaller machine code footprint — better for many small containers.
      # --gc-interval=100         : Force minor GC sweep every 100 allocations (prevents heap spikes).
      # ─────────────────────────────────────────────────────────────────
      - NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64 --expose-gc --optimize-for-size --gc-interval=100
    
    volumes:
      - ./server_logs/${DOMAIN}:/app/logs
      - ./server_uploads/${DOMAIN}:/app/uploads

    # ─────────────────────────────────────────────────────────────────
    # TMPFS: Temp files written to RAM — zero disk I/O, auto-cleared on restart
    # /tmp is used by Node, multer uploads-in-progress, and OS temp ops.
    # Size capped at 128MB so it doesn't eat into the 1GB container RAM limit.
    # ─────────────────────────────────────────────────────────────────
    tmpfs:
      - /tmp:size=128m,mode=1777
      
    labels:
      - "traefik.enable=true"
      # Load Balancer Rule (Round Robin by default)
      - "traefik.http.routers.${ROUTER_NAME}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_NAME}.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=5000"
      
      # Sticker / Session Stickiness (Optional)
      # Keeps a user connected to the same container if needed
      # - "traefik.http.services.wa.loadbalancer.sticky.cookie=true"
    
    # ─────────────────────────────────────────────────────────────────
    # HEALTHCHECK: Docker restarts container if /health stops responding.
    # Uses Node.js built-in http module — works in ANY Node image (slim/full).
    # curl is NOT pre-installed in node:18-slim, so we avoid depending on it.
    # ─────────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ─────────────────────────────────────────────────────────────────
    # ULIMITS: Prevent file descriptor / process exhaustion
    # nofile 65536: Each open socket, log file, DB connection = 1 file descriptor.
    # Default Linux limit is 1024 — way too low for a busy Node.js server.
    # ─────────────────────────────────────────────────────────────────
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK}
