services:
  whatsapp-app:
    build: 
      context: .
      args:
        - VITE_CLIENT_URL=${CLIENT_URL}
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY}
        - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
        - VITE_MASTER_URL=${VITE_MASTER_URL}
        - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
    image: whatsapp-app:${IMAGE_TAG}
    restart: always
    user: root
    
    deploy:
      mode: replicated
      replicas: 1 
      endpoint_mode: vip
      resources:
        limits:
          cpus: '0.8'    
          memory: 2500M 
        reservations:
          cpus: '0.2'    
          memory: 1G    
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      
    environment:
      - TZ=Asia/Kolkata
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - APP_URL=${APP_URL}
      - PORT=5000
      - NODE_ENV=production
      - VITE_CLIENT_URL=${CLIENT_URL}
      - DOMAIN=${DOMAIN}
      - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - VITE_MASTER_URL=${VITE_MASTER_URL}
      - REDIS_URL=redis://redis:6379
      - DRIP_WORKER_COUNT=${DRIP_WORKER_COUNT:-1}
      - NODE_OPTIONS=--max-old-space-size=2048 --max-semi-space-size=64 --expose-gc
      - NODE_DNS_ORDER=ipv4first
      - UV_THREADPOOL_SIZE=16
    
    volumes:
      - /var/log/whatsapp-app/${DOMAIN}:/app/logs
      - /var/www/whatsapp-uploads/${DOMAIN}:/app/uploads
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728   # 128MB
    
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=5000"
      
      # Define the HTTP to HTTPS redirect middleware
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"

      # Sticky Session Configuration (CRITICAL for Socket.IO multi-container)
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.sticky.cookie.name=sticky_${ROUTER_NAME}"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.sticky.cookie.httpOnly=true"
    networks:
      - traefik_network
      - internal_network

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.8'      
          memory: 500M    
        reservations:
          cpus: '0.1'      
          memory: 200M     
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK}