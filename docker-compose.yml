services:
  whatsapp-app:
    build: 
      context: .
      args:
        - VITE_CLIENT_URL=${CLIENT_URL}
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY}
        - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
        - VITE_MASTER_URL=${VITE_MASTER_URL}
        - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
    image: whatsapp-app:${IMAGE_TAG}
    restart: always
    user: root
    
    # 🔄 SCALABILITY CONFIGURATION (Docker Swarm Compatible)
    # 🔄 HIGH PERFORMANCE SCALING (For 32GB RAM / 8 Cores)
    # 🔄 SCALABILITY CONFIGURATION (Dynamic for Bulk Deployment)
    deploy:
      mode: replicated
      replicas: 6 # High Performance: 6 Replicas for scalable capacity
      endpoint_mode: vip
      resources:
        limits:
          cpus: '0.8'    # Leave 20% of core for OS/Traefik
          memory: 2500M  # ~2.5GB RAM limit per container
        reservations:
          cpus: '0.2'    # Minimum core reserved
          memory: 1G     # 1GB RAM reserved
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    # NOTE: Native Docker Compose cannot Auto-Scale based on CPU %.
    # You must use Docker Swarm with a service like 'orbiter' or Kubernetes HPA.
    
    # Set container name to domain for easy identification
    # container_name: ${DOMAIN} # DISABLED: Must be removed when using replicas > 1 

    # env_file:
    #   - ./server/.env
    
    environment:
      - TZ=Asia/Kolkata
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - APP_URL=${APP_URL}
      - PORT=5000
      - NODE_ENV=production
      - VITE_CLIENT_URL=${CLIENT_URL}
      - DOMAIN=${DOMAIN}
      - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - VITE_BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - VITE_MASTER_URL=${VITE_MASTER_URL}
      # Drip Campaign Workers Configuration
      - DRIP_WORKER_COUNT=${DRIP_WORKER_COUNT:-1}
      # MEMORY OPTIMIZATION: Maximize usage of 2.5GB container limit
      - NODE_OPTIONS=--max-old-space-size=2048 --max-semi-space-size=64 --expose-gc
      # CRITICAL NETWORK FIX: Force IPv4 DNS resolution inside Docker.
      # Meta's CDN (lookaside.fbsbx.com) causes ECONNRESET when Docker uses IPv6.
      # This is the OS-level fix; code-level fix is family:4 in https.Agent.
      - NODE_DNS_ORDER=ipv4first
      # TUNE GC & FILE I/O: Prevent blocking the event loop on multi-tenant traffic
      - UV_THREADPOOL_SIZE=16
    
    volumes:
      - ./server_logs/${DOMAIN}:/app/logs
      - ./server_uploads/${DOMAIN}:/app/uploads
      # tmpfs: RAM-backed temp storage for faster processing
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728   # 128MB
    
    # CRITICAL: Prevent "Too many open files" errors causing ECONNRESET
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # HEALTHCHECK: Traefik will skip any frozen container automatically
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=5000"
      
      # Define the HTTP to HTTPS redirect middleware
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"

      # Sticker / Session Stickiness (Optional)
      # Keeps a user connected to the same container if needed
      # - "traefik.http.services.wa.loadbalancer.sticky.cookie=true"
    
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK}