  <style>
    :root {
      /* Default Fallback Colors */
      --color-brand: #ea580c;
      --color-brand-rgb: 234 88 12;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-sidebar-text: #475569;
      --color-sidebar-active-bg: #fff7ed;
      --radius-btn: 0.75rem;
    }

    /* ── Anti-White-Flash: paint the background before React ── */
    html, body {
      background-color: var(--color-bg);
      margin: 0; padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image: linear-gradient(to bottom, rgb(var(--color-brand-rgb) / 0.03) 0%, transparent 400px);
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--color-text);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Instant skeleton painted before JS loads — zero white flash */
    #root:empty {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--color-bg);
    }
    #root:empty::before {
      content: '';
      display: block;
      width: 48px;
      flex-shrink: 0;
      background: #1e293b;
      height: 100%;
    }
    #root:empty::after {
      content: '';
      flex: 1;
      display: block;
      background:
        /* Header bar */
        linear-gradient(#e2e8f0 40px, transparent 0)
          0 0 / 100% 56px no-repeat,
        /* Skeleton card row 1 */
        linear-gradient(#e2e8f0 120px, transparent 0)
          16px 72px / calc(25% - 24px) 120px no-repeat,
        linear-gradient(#e2e8f0 120px, transparent 0)
          calc(25% + 4px) 72px / calc(75% - 24px) 120px no-repeat,
        /* Skeleton card row 2 */
        linear-gradient(#e2e8f0 80px, transparent 0)
          16px 208px / calc(33% - 12px) 80px no-repeat,
        linear-gradient(#e2e8f0 80px, transparent 0)
          calc(33% + 8px) 208px / calc(33% - 12px) 80px no-repeat,
        linear-gradient(#e2e8f0 80px, transparent 0)
          calc(66% + 8px) 208px / calc(34% - 24px) 80px no-repeat,
        /* Page background */
        var(--color-bg);
      background-size:
        100% 56px,
        calc(25% - 24px) 120px,
        calc(75% - 24px) 120px,
        calc(33% - 12px) 80px,
        calc(33% - 12px) 80px,
        calc(34% - 24px) 80px,
        100% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    @keyframes shimmer {
      0%   { opacity: 1; }
      50%  { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(107, 114, 128, 0.8);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body.dragging-node,
    body.is-connecting {
      user-select: none;
      -webkit-user-select: none;
    }

    body.is-connecting * {
      cursor: crosshair !important;
    }
  </style>

<body class="overflow-hidden h-screen w-screen">
  <!-- Root painted with bg-color before JS mounts (eliminates white flash) -->
  <div id="root" class="h-full w-full" style="background-color:var(--color-bg)"></div>
  <!-- Runtime Configuration Loader -->
  <script src="/config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
