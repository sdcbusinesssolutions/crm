  <style>
    :root {
      /* Default Fallback Colors */
      --color-brand: #ea580c;
      --color-brand-rgb: 234 88 12;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-sidebar-text: #475569;
      --color-sidebar-active-bg: #fff7ed;
      --radius-btn: 0.75rem;
    }

    body {
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      background-color: var(--color-bg);
      background-image: linear-gradient(to bottom, rgb(var(--color-brand-rgb) / 0.03) 0%, transparent 400px);
      background-attachment: fixed;
      background-repeat: no-repeat;

      color: var(--color-text);
      transition: background-color 0.3s, color 0.3s;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(107, 114, 128, 0.8);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body.dragging-node,
    body.is-connecting {
      user-select: none;
      -webkit-user-select: none;
    }

    body.is-connecting * {
      cursor: crosshair !important;
    }
  </style>

<body class="overflow-hidden h-screen w-screen">
  <div id="root" class="h-full w-full"></div>
  <!-- Runtime Configuration Loader -->
  <script src="/config.js"></script>

</body>
