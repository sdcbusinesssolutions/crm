version: '3.8'

services:
  whatsapp-app-test:
    build: .
    container_name: whatsapp_local_test
    restart: always
    # This exposes the app directly to your PC's port 5000
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Config Generation Variables
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - CLIENT_URL=http://localhost:5000
      - API_URL=/api
      - VITE_MASTER_URL=http://localhost:5000
      - BRIDGE_DOMAIN=http://localhost:5000
